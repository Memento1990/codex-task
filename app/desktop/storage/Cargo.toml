[package]
name = "floatboard-storage"
version = "2.0.0"
edition = "2021"

[dependencies]
floatboard-protocol = { path = "../protocol" }
floatboard-client = { path = "../client" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
rusqlite = { version = "=0.41.1", features = ["bundled"] }
sha2 = "=0.10.9"
regex = "=1.13.1"
uuid = { version = "=1.29.0", features = ["v4"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Security_Cryptography", "Win32_System_Memory"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "system-proxy"] }
base64 = "0.22"
rand = "0.8"
