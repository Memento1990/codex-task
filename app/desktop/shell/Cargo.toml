[package]
name = "floatboard-shell"
version = "2.0.0"
edition = "2021"

[dependencies]
floatboard-client = { path = "../client" }
floatboard-protocol = { path = "../protocol" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
uuid = { version = "=1.29.0", features = ["v4"] }
sha2 = "=0.10.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "system-proxy"] }
ed25519-dalek = "2"
base64 = "0.22"
semver = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
rand = "0.8"
winreg = "=0.56.0"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security_Cryptography", "Win32_UI_WindowsAndMessaging"] }

[[bin]]
name = "FloatboardUpdater"
path = "src/updater_main.rs"

[[bin]]
name = "FloatboardLauncher"
path = "src/launcher_main.rs"

[[bin]]
name = "FloatboardRelease"
path = "src/update_release.rs"

[[bin]]
name = "FloatboardInstaller"
path = "src/installer_main.rs"
