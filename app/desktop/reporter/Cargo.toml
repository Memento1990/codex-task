[package]
name = "floatboard-core"
version = "0.8.0"
edition = "2021"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
rusqlite = { version = "=0.41.1", features = ["bundled"] }
sha2 = "=0.10.9"
regex = "=1.13.1"
uuid = { version = "=1.29.0", features = ["v4"] }
toml_edit = { version = "=0.25.13", features = ["serde"] }
winreg = "=0.56.0"
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[[bin]]
name = "FloatboardReporter"
path = "src/main.rs"
