<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方案 A · 巡检矩阵 — Codex Floatboard 重设计</title>
<style>
:root{
  --bg:#08090b; --panel:#0e1013; --panel2:#12161b; --panel3:#171c22;
  --line:#1c2027; --line2:#2a3038; --line3:#3a424c;
  --fg:#d7dce2; --fg2:#a4adb8; --dim:#78828e; --dim2:#59616b;
  --amber:#f2b544; --red:#f2705e; --green:#5fd08a; --blue:#6fa8dc; --violet:#a48cf0;
  --mono:ui-monospace,"JetBrains Mono","SFMono-Regular",Consolas,"Liberation Mono",monospace;
  --sans:"Inter","Segoe UI Variable","Microsoft YaHei UI","PingFang SC","Noto Sans SC",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;font-size:12px;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#2c333b;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* ── 原型外壳（非产品 UI） ───────────────────────────────── */
.proto{min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:0;padding:26px 20px 88px}
.proto-tag{width:100%;max-width:1320px;display:flex;align-items:baseline;gap:12px;
  font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.04em;margin-bottom:18px}
.proto-tag b{color:var(--fg);font-weight:600;letter-spacing:0}
.proto-tag span{color:var(--dim2)}
.stage{width:100%;max-width:1320px;display:flex;justify-content:center;align-items:flex-start;gap:24px;flex-wrap:wrap}
.screen-dock{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:90;
  display:flex;gap:2px;padding:5px;background:#0c0e11ee;border:1px solid #262c34;border-radius:11px;
  backdrop-filter:blur(14px);box-shadow:0 12px 32px #000a}
.screen-dock button{font-family:var(--mono);font-size:11px;color:var(--dim);padding:6px 11px;border-radius:7px;
  white-space:nowrap;transition:background .12s,color .12s}
.screen-dock button:hover{background:#1a2027;color:var(--fg2)}
.screen-dock button.on{background:#e8edf3;color:#0b0d10;font-weight:600}
.screen-dock .sep{width:1px;background:#262c34;margin:4px 3px;flex:none}
.screen-dock{max-width:calc(100vw - 24px);overflow-x:auto}
.screen-dock button{flex:none}

/* ── 窗口外壳 ───────────────────────────────────────────── */
.win{background:var(--panel);border:1px solid var(--line2);border-radius:10px;overflow:hidden;
  display:flex;flex-direction:column;box-shadow:0 24px 60px -12px #000d,0 0 0 1px #0006}
.win.wide{width:980px;height:680px}
.win.narrow{width:392px;height:570px}
/* 窄窗工具栏：标题与连接徽标不换行，副标题让位，剩余空间全部给操作按钮。 */
.win.narrow .bar{gap:7px;padding:0 2px 0 10px}
.win.narrow .bar h1{white-space:nowrap;flex:none}
.win.narrow .bar .conn{white-space:nowrap;flex:none;overflow:hidden;text-overflow:ellipsis;max-width:84px}
.win.narrow .bar .tools{flex:none}
.win.narrow .wctl button{width:30px}
.win.narrow .stat .k{font-size:8px;letter-spacing:.06em}
.win.narrow .doneband{padding:0 10px;font-size:9px}
.win.narrow .doneband button[data-screen]{margin-left:6px}

/* 工具栏 */
.bar{height:38px;flex:none;display:flex;align-items:center;gap:10px;padding:0 8px 0 12px;
  background:var(--panel);border-bottom:1px solid var(--line);-webkit-app-region:drag;user-select:none}
.bar .mark{width:19px;height:19px;border-radius:4px;background:var(--fg);color:#0b0d10;
  font:700 10px/19px var(--mono);text-align:center;flex:none}
.bar h1{font-size:12px;font-weight:600;margin:0;letter-spacing:.01em}
.bar .conn{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;
  color:var(--dim);padding:2px 7px 2px 6px;border:1px solid var(--line2);border-radius:20px}
.bar .conn i{width:5px;height:5px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)}
.bar .conn.warn i{background:var(--amber);box-shadow:0 0 6px var(--amber)}
.bar .spacer{flex:1}
.bar .tools{display:flex;gap:1px;-webkit-app-region:no-drag}
.ibtn{width:27px;height:27px;display:grid;place-items:center;border-radius:5px;color:var(--fg2);
  transition:background .1s,color .1s}
.ibtn:hover{background:#1b2128;color:var(--fg)}
.ibtn.on{color:var(--amber)}
.ibtn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.4;
  stroke-linecap:round;stroke-linejoin:round}
.wctl{display:flex;-webkit-app-region:no-drag}
.wctl button{width:38px;height:38px;display:grid;place-items:center;color:var(--dim);border-radius:0}
.wctl button:hover{background:#1b2128;color:var(--fg)}
.wctl button.x:hover{background:#c0402f;color:#fff}
.wctl svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:1.2}

/* ── 全局总览带 ─────────────────────────────────────────── */
.overview{flex:none;display:grid;grid-template-columns:repeat(4,auto) 1fr;gap:0;
  border-bottom:1px solid var(--line);background:var(--panel2)}
.stat{padding:11px 18px 12px;border-right:1px solid var(--line)}
.stat .k{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--dim2);text-transform:uppercase}
.stat .v{font-family:var(--mono);font-size:21px;font-weight:600;line-height:1.15;margin-top:3px;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat .v small{font-size:10px;font-weight:400;color:var(--dim2);margin-left:4px;letter-spacing:0}
.stat.blocked .v{color:var(--amber)}
.stat.running .v{color:var(--blue)}
.stat.done .v{color:var(--green)}
.dist{padding:11px 18px;display:flex;flex-direction:column;justify-content:center;gap:7px;min-width:0}
.dist .lbl{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--dim2);text-transform:uppercase}
.distbar{display:flex;height:7px;border-radius:2px;overflow:hidden;background:#191e24;gap:1px}
.distbar i{display:block;height:100%;transition:width .3s}
.distbar i.r{background:var(--blue)} .distbar i.b{background:var(--red)}
.distbar i.w{background:var(--amber)} .distbar i.d{background:var(--green)}
.distbar i.u{background:#3a424c}
.distbar i.c{background:var(--violet)}
.dist .legend{display:flex;gap:12px;font-family:var(--mono);font-size:9px;color:var(--dim)}
.dist .legend span{display:flex;align-items:center;gap:4px}
.dist .legend b{width:6px;height:6px;border-radius:1px;display:block}

/* ── 表头 + 行 ─────────────────────────────────────────── */
/* 条纹是绝对定位，不参与 grid 流；行与表头都用 5 列，保证列对齐。 */
.grid-head,.row{display:grid;align-items:center;
  grid-template-columns:minmax(150px,1.35fr) 132px minmax(140px,1fr) 62px 78px}
.grid-head{height:30px;flex:none;border-bottom:1px solid var(--line);background:var(--panel);
  font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--dim2);text-transform:uppercase;
  padding-right:10px}
.grid-head>span{padding-left:16px}
.grid-head>span:nth-child(4),.grid-head>span:nth-child(5){text-align:right;padding-right:12px;padding-left:0}
.rows{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0}

.row{border-bottom:1px solid var(--line);min-height:44px;cursor:pointer;position:relative;
  padding-right:10px;background:transparent;transition:background .1s}
.row:hover{background:#111519}
.row.sel{background:#131920}
.row.sel::after{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--fg)}
.row .stripe{width:3px;height:100%;position:absolute;left:0;top:0;bottom:0;opacity:.85}
.row.sel .stripe{opacity:1}
.stripe.blocked{background:var(--red)} .stripe.running{background:var(--blue)}
.stripe.waiting{background:var(--amber)} .stripe.done{background:var(--green)}
.stripe.unknown{background:#3a424c} .stripe.cancelled{background:var(--violet)}
.row .name{padding-left:16px;min-width:0}
.row .name b{display:block;font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;letter-spacing:.01em}
.row .name small{font-family:var(--mono);font-size:9.5px;color:var(--dim2);display:block;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .prog{padding-left:12px;display:flex;flex-direction:column;gap:4px;justify-content:center}
.pbar{height:3px;background:#1b2027;border-radius:2px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:2px;transition:width .3s}
.pbar i.blocked{background:var(--red)} .pbar i.running{background:var(--blue)}
.pbar i.waiting{background:var(--amber)} .pbar i.done{background:var(--green)}
.pbar i.unknown{background:#3a424c} .pbar i.cancelled{background:var(--violet)}
.prog .n{font-family:var(--mono);font-size:9.5px;color:var(--dim);display:flex;justify-content:space-between}
.row .step{padding-left:12px;font-size:11px;color:var(--fg2);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.row .step em{font-style:normal;color:var(--dim2);font-family:var(--mono);font-size:10px;
  display:block;margin-top:1px}
.row .blk{padding-right:12px;text-align:right;font-family:var(--mono);font-size:11px}
.row .blk.has{color:var(--red);font-weight:600}
.row .blk.none{color:#39424c}
.row .time{padding-right:12px;text-align:right;font-family:var(--mono);font-size:11px;color:var(--dim);
  font-variant-numeric:tabular-nums}
.row .time.live{color:var(--fg2)}
.row .chev{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-family:var(--mono);
  font-size:9px;color:var(--dim2);opacity:0;transition:opacity .1s}
.row:hover .chev{opacity:1}

/* 展开区 */
.expand{border-bottom:1px solid var(--line);background:#0b0e11;padding:0 12px 14px 16px;
  display:grid;grid-template-columns:1.15fr 1.25fr .9fr;gap:16px}
.expand .col-h{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--dim2);
  text-transform:uppercase;margin:10px 0 7px;display:flex;justify-content:space-between}
.step-row{display:grid;grid-template-columns:14px 1fr auto;gap:7px;align-items:baseline;
  padding:3px 0;font-size:11px;color:var(--fg2)}
.step-row .m{font-family:var(--mono);font-size:10px;text-align:center}
.step-row.completed .m{color:var(--green)}
.step-row.inProgress .m{color:var(--blue)}
.step-row.blocked .m{color:var(--red)}
.step-row.pending .m{color:#434b55}
.step-row.pending .t{color:var(--dim2)}
.step-row.blocked .t{color:var(--fg)}
.step-row .tm{font-family:var(--mono);font-size:9.5px;color:var(--dim2);white-space:nowrap}
.step-row .note{grid-column:2/4;font-size:10px;color:var(--dim2);margin-top:-1px}
.bcard{border:1px solid var(--line2);border-left:2px solid var(--red);border-radius:4px;
  padding:7px 9px;margin-bottom:6px;background:#101318}
.bcard .bt{display:flex;justify-content:space-between;gap:8px;font-size:11px;font-weight:500;color:var(--fg)}
.bcard .bt em{font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--red);white-space:nowrap}
.bcard dl{margin:5px 0 0;display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:10px;
  color:var(--dim);line-height:1.5}
.bcard dt{font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--dim2);
  text-transform:uppercase;padding-top:1px}
.bcard dd{margin:0;color:var(--fg2)}
.evrow{display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px solid #15191e;
  font-size:11px;color:var(--fg2)}
.evrow .ico{font-family:var(--mono);color:var(--dim2);font-size:10px}
.evrow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evrow em{font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--dim2)}
.evrow button{color:var(--blue);font-family:var(--mono);font-size:10px;text-decoration:none;
  border-bottom:1px dotted #3a5568}
.empty{padding:14px 2px;color:var(--dim2);font-size:11px}
.expand-actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:14px;font-family:var(--mono);font-size:10px;color:var(--fg2)}

/* 页脚 */
.foot{flex:none;height:29px;border-top:1px solid var(--line);display:flex;align-items:center;
  gap:12px;padding:0 12px;font-family:var(--mono);font-size:9.5px;color:var(--dim2);background:var(--panel)}
.foot .r{margin-left:auto;display:flex;gap:12px;align-items:center}
.foot button{color:var(--dim);font-family:var(--mono);font-size:9.5px}
.foot button:hover{color:var(--fg2);text-decoration:underline}
.doneband{flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;height:30px;
  border-bottom:1px solid var(--line);background:#0b0e11;font-family:var(--mono);font-size:10px;color:var(--dim)}
.doneband b{color:var(--green)}
.doneband button{margin-left:auto;color:var(--fg2);font-family:var(--mono);font-size:10px}
.doneband button:hover{color:#fff;text-decoration:underline}

/* ── 窄窗 ──────────────────────────────────────────────── */
.win.narrow .grid-head{display:none}
.win.narrow .overview{grid-template-columns:repeat(3,1fr)}
.win.narrow .overview .dist{display:none}
.win.narrow .stat:nth-child(4){display:none}
.win.narrow .stat{padding:9px 10px 10px;border-right:1px solid var(--line)}
.win.narrow .stat .v{font-size:17px}
.win.narrow .row{grid-template-columns:18px 1fr auto;grid-template-areas:"s n t" ". p p";
  align-items:start;padding:9px 10px 9px 0;min-height:0;row-gap:5px}
.win.narrow .row .name{grid-area:n;padding-left:12px}
.win.narrow .row .time{grid-area:t;padding-right:0;font-size:10px}
.win.narrow .row .prog{grid-area:p;padding-left:12px;padding-right:0;flex-direction:row;align-items:center;gap:8px}
.win.narrow .row .prog .pbar{flex:1}
.win.narrow .row .step,.win.narrow .row .blk{display:none}
.win.narrow .expand{grid-template-columns:1fr;gap:0;padding:0 10px 12px 12px}

/* 主视图步骤备注沿用原有样式。 */
.note{font-family:var(--mono);font-size:10px;color:var(--dim);background:#0b0e11;border:1px solid var(--line);
  border-radius:4px;padding:7px 10px;line-height:1.6}

[data-theme="light"] ::-webkit-scrollbar-thumb{background:var(--line2)}
[data-theme="light"] .screen-dock{background:var(--panel);border-color:var(--line2)}
[data-theme="light"] .screen-dock .sep{background:var(--line2)}
[data-theme="light"] .screen-dock button:hover,
[data-theme="light"] .ibtn:hover,
[data-theme="light"] .wctl button:not(.x):hover,
[data-theme="light"] .row:hover{background:var(--panel2)}
[data-theme="light"] .screen-dock button.on{background:var(--fg);color:var(--panel)}
[data-theme="light"] .bar .mark{color:var(--panel)}
[data-theme="light"] .row.sel{background:var(--panel3)}
[data-theme="light"] .expand,
[data-theme="light"] .doneband,
[data-theme="light"] .note{background:var(--panel2)}
[data-theme="light"] .bcard{background:var(--panel)}
[data-theme="light"] .pbar,
[data-theme="light"] .distbar{background:var(--line)}
[data-theme="light"] .row .blk.none,
[data-theme="light"] .step-row.pending .m{color:var(--dim2)}
[data-theme="light"] .evrow{border-bottom-color:var(--line)}
[data-theme="light"] .evrow button{border-bottom-color:var(--blue)}
[data-theme="light"] .doneband button:hover{color:var(--fg)}
</style>
<link rel="stylesheet" href="shared/mock.css">
</head>
<body>
<div class="proto">
  <div class="proto-tag">
    <b>方案 A · 巡检矩阵</b><span>交互模型：一张表看完全部任务，行内展开下钻</span>
    <span style="margin-left:auto">原型 · 合成数据 · 非产品构建</span>
  </div>
  <div class="stage" id="stage"></div>
</div>

<nav class="screen-dock" id="dock"></nav>

<script src="shared/data.js"></script>
<script src="shared/kit.js"></script>
<script src="shared/mock.js"></script>
<script>
const K = KIT, FB = window.FB;
const S = { screen: 'main', sel: 'pay', showDone: false, theme: 'dark' };
/* 支持 #screen 直接定位，便于逐屏校对与分享。 */
if (location.hash.length > 1) S.screen = location.hash.slice(1);

const SCREENS = [
  ['main','主窗 980'], ['narrow','窄窗 392'], ['dock','贴边头像球'], ['|', ''],
  ['completed','完成记录'], ['settings','设置'], ['integration','Codex 接入'], ['|', ''],
  ['notifications','消息通知'], ['updates','版本更新'], ['repair','修复记录'],
];

const ICON = {
  pin:'<path d="m7 3 7 0-1 5 3 3H4l3-3V3Zm3 8v6"/>',
  more:'<circle cx="4" cy="10" r="1" fill="currentColor" stroke="none"/><circle cx="10" cy="10" r="1" fill="currentColor" stroke="none"/><circle cx="16" cy="10" r="1" fill="currentColor" stroke="none"/>',
  min:'<path d="M4 10h12"/>',
  max:'<rect x="4" y="4" width="12" height="12" rx="1"/>',
  close:'<path d="m5 5 10 10M15 5 5 15"/>',
  dock:'<circle cx="10" cy="10" r="7"/><path d="M7 8 9 10 7 12m4 0h2"/>',
  gear:'<circle cx="10" cy="10" r="2.6"/><path d="M10 2.6v2M10 15.4v2M2.6 10h2M15.4 10h2M4.8 4.8l1.4 1.4M13.8 13.8l1.4 1.4M15.2 4.8l-1.4 1.4M6.2 13.8l-1.4 1.4"/>',
  search:'<circle cx="9" cy="9" r="5"/><path d="m13 13 3.5 3.5"/>',
};
const ic = (n) => `<svg viewBox="0 0 20 20">${ICON[n]}</svg>`;

function bar(title, conn, tools) {
  return `<div class="bar">
    <span class="mark">&gt;_</span><h1>${title}</h1>
    <span class="conn ${conn.warn ? 'warn' : ''}"><i></i>${conn.text}</span>
    <div class="spacer"></div>
    <div class="tools">${tools}</div>
    <div class="wctl">
      <button title="最小化" data-mock="minimize">${ic('min')}</button>
      <button title="最大化" data-mock="maximize">${ic('max')}</button>
      <button class="x" title="关闭到托盘" data-mock="close">${ic('close')}</button>
    </div>
  </div>`;
}

function counts() {
  const ts = FB.tasks;
  const act = ts.filter(t => !['completed','cancelled','unreported'].includes(t.status));
  return {
    running: act.filter(t => t.status === 'running' && !K.openBlockers(t).length).length,
    blocked: act.filter(t => K.openBlockers(t).length).length,
    waiting: act.filter(t => t.status === 'waiting' && !K.openBlockers(t).length).length,
    done: ts.filter(t => t.status === 'completed').length,
    unreported: ts.filter(t => t.status === 'unreported').length,
    cancelled: ts.filter(t => t.status === 'cancelled').length,
    total: ts.length,
    blockers: ts.reduce((n, t) => n + K.openBlockers(t).length, 0),
  };
}

function overview() {
  const c = counts();
  const seg = [
    ['r', c.running], ['b', c.blocked], ['w', c.waiting], ['d', c.done], ['u', c.unreported], ['c', c.cancelled],
  ];
  const pctOf = (n) => (n / c.total * 100).toFixed(2) + '%';
  return `<div class="overview">
    <div class="stat running"><div class="k">在跑</div><div class="v">${c.running}</div></div>
    <div class="stat blocked"><div class="k">受阻</div><div class="v">${c.blocked}<small>${c.blockers} 卡点</small></div></div>
    <div class="stat"><div class="k">待你确认</div><div class="v">${c.waiting}</div></div>
    <div class="stat done"><div class="k">已完成</div><div class="v">${c.done}</div></div>
    <div class="dist">
      <div class="lbl">任务分布 · ${c.total}</div>
      <div class="distbar">${seg.filter(s => s[1]).map(s => `<i class="${s[0]}" style="width:${pctOf(s[1])}"></i>`).join('')}</div>
      <div class="legend">
        <span><b style="background:var(--blue)"></b>在跑</span>
        <span><b style="background:var(--red)"></b>受阻</span>
        <span><b style="background:var(--amber)"></b>待确认</span>
        <span><b style="background:var(--green)"></b>完成</span>
        ${c.unreported ? `<span><b style="background:#3a424c"></b>未汇报 ${c.unreported}</span>` : ''}
        ${c.cancelled ? `<span><b style="background:var(--violet)"></b>已取消 ${c.cancelled}</span>` : ''}
      </div>
    </div>
  </div>`;
}

function rowHTML(t, narrow) {
  const tn = K.tone(t);
  const p = K.pct(t), d = K.doneSteps(t);
  const ob = K.openBlockers(t);
  const el = K.elapsed(t);
  const sel = S.sel === t.id;
  const runtime = t.status === 'completed' ? '已结束' : (K.RUNTIME[t.runtime] || '');
  return `<div class="row ${sel ? 'sel' : ''}" data-task="${t.id}">
    <span class="stripe ${tn}"></span>
    <div class="name"><b>${K.esc(t.title)}</b><small>${K.esc(t.tag)} · ${runtime}${t.status === 'unreported' ? ' · 等待结构化汇报' : ''}</small></div>
    <div class="prog"><div class="pbar"><i class="${tn}" style="width:${p * 100}%"></i></div>
      <div class="n"><span>${d}/${t.plan.length || 0}${t.plan.length ? '' : ' 步骤'}</span><span>${Math.round(p * 100)}%</span></div></div>
    <div class="step">${K.esc(t.currentStep || (t.status === 'completed' ? '—' : '等待下一步进展'))}<em>${ob.length ? ob[0].title : K.STATUS[t.status]}</em></div>
    <div class="blk ${ob.length ? 'has' : 'none'}">${ob.length ? '! ' + ob.length : '—'}</div>
    <div class="time ${t.status !== 'completed' ? 'live' : ''}" title="${t.timing?.partial ? '部分计时记录' : '自然耗时'}">${t.timing?.partial ? '≥ ' : ''}<span data-live-elapsed="${t.id}">${K.fmtCompact(el)}</span></div>
  </div>${sel ? expandHTML(t) : ''}`;
}

function expandHTML(t) {
  const ob = K.openBlockers(t);
  const closed = t.blockers.filter(b => !b.open);
  const now = FB.now();
  const steps = t.plan.map(s => `<div class="step-row ${s.status}">
      <span class="m">${K.STEPMARK[s.status] || '·'}</span>
      <span class="t">${K.esc(s.title)}</span>
      <span class="tm">${s.timing ? K.fmtCompact(K.elapsed(s)) + (s.timing.partial ? ' · 部分' : '') : s.endedAt && s.startedAt ? K.fmtCompact(s.endedAt - s.startedAt) : s.status === 'inProgress' && s.startedAt ? K.fmtCompact(now - s.startedAt) : ''}</span>
      ${s.note ? `<div class="note">${K.esc(s.note)}</div>` : ''}
    </div>`).join('');
  const bcards = [...ob, ...closed].map(b => `<div class="bcard" data-blocker-id="${b.id}" style="${b.open ? '' : 'border-left-color:#3a424c;opacity:.62'}">
      <div class="bt"><span>${K.esc(b.title)}</span><em style="${b.open ? '' : 'color:#7d8894'}">${b.open ? '<span data-live-blocker="' + b.id + '">' + (b.openedAt ? K.fmtCompact(now - b.openedAt) : '时间未记录') + '</span>' : '已解除'}</em></div>
      <dl>
        <dt>原因</dt><dd>${K.esc(b.reason)}</dd>
        ${b.impact ? `<dt>影响</dt><dd>${K.esc(b.impact)}</dd>` : ''}
        <dt>处理方</dt><dd>${K.esc(b.owner)}</dd>
        <dt>解除</dt><dd>${K.esc(b.resolveWhen)}</dd>
      </dl>
    </div>`).join('');
  const evs = t.evidence.map(e => `<div class="evrow"><span class="ico">◇</span><span title="${K.esc(e.reference)}">${K.esc(e.label)}</span><em>${e.at ? K.ago(e.at, now) : '时间未知'}</em><button data-mock="evidence" data-task="${t.id}" data-evidence="${e.id}">打开</button></div>`).join('');
  return `<div class="expand">
    <div><div class="col-h"><span>清单</span><span>${K.doneSteps(t)}/${t.plan.length}</span></div>${steps || '<div class="empty">尚未汇报清单</div>'}</div>
    <div><div class="col-h"><span>卡点</span><span>${ob.length} 未解除</span></div>${bcards || '<div class="empty">暂无已汇报卡点</div>'}</div>
    <div><div class="col-h"><span>验收证据</span><span>${t.evidence.length}</span></div>${evs || '<div class="empty">暂无验收证据</div>'}</div>
    <div class="expand-actions"><button data-mock="detail" data-task="${t.id}">任务详情 ↗</button>${!['completed','cancelled','unreported'].includes(t.status) ? `<button data-mock="advance" data-task="${t.id}">推进任务 ▸</button>` : ''}</div>
  </div>`;
}

function mainScreen(narrow) {
  const done = FB.tasks.filter(t => t.status === 'completed');
  const list = MOCK.tasks({ includeCompleted: S.showDone }).filter(t => S.showDone || MOCK.includeCompleted() || t.status !== 'completed');
  const rows = list.map(t => rowHTML(t, narrow)).join('');
  const c = counts();
  return `<div class="win ${narrow ? 'narrow' : 'wide'}">
    ${bar(narrow ? '巡检台' : '巡检台', { text: MOCK.connectionLabel() },
      `<button class="ibtn" title="搜索任务或命令" data-mock="palette">${ic('search')}</button>
       <button class="ibtn on" title="收起为头像球" data-mock="dock">${ic('dock')}</button>
       <button class="ibtn" title="设置" data-screen="settings">${ic('gear')}</button>
       <button class="ibtn" title="更多" data-mock="palette">${ic('more')}</button>`)}
    ${overview()}
    ${MOCK.toolbar()}
    <div class="grid-head"><span>任务</span><span>进度</span><span>当前步骤</span><span>卡点</span><span>耗时</span></div>
    <div class="rows">${rows || '<div class="empty">无匹配任务</div>'}</div>
    <div class="doneband">
      <b>✓ ${done.length}</b> 项已完成
      <button data-toggle-done="1">${S.showDone ? '收起已完成' : '在表中显示 ↗'}</button>
      <button data-screen="completed" style="margin-left:14px">完成记录 ↗</button>
    </div>
    <div class="foot"><span>共 ${c.total} 个任务 · 完成 ${c.done} · ${c.blockers} 个未解除卡点</span>
      <span class="r"><button data-mock="copy-session">复制会话 ID</button><span>0.14.1</span></span></div>
  </div>`;
}

function dockScreen() {
  return MOCK.dock('a');
}

function render() {
  const map = { main: () => mainScreen(false), narrow: () => mainScreen(true), dock: dockScreen };
  document.getElementById('stage').innerHTML = MOCK.utility(S.screen) || (map[S.screen] || map.main)();
  document.getElementById('dock').innerHTML = SCREENS.map(([k, label]) =>
    k === '|' ? '<span class="sep"></span>' : `<button class="${S.screen === k ? 'on' : ''}" data-screen="${k}">${label}</button>`).join('');
  MOCK.afterRender();
}

document.addEventListener('click', (e) => {
  if (e.target.closest('[data-mock]')) return;
  const td = e.target.closest('[data-toggle-done]');
  if (td) { S.showDone = !S.showDone; render(); return; }
  const row = e.target.closest('.row');
  if (row) { S.sel = S.sel === row.dataset.task ? '' : row.dataset.task; render(); }
});

MOCK.install({ variant: 'a', state: S, render, selected: () => S.sel, select: (id) => { S.sel = id; } });
render();
</script>
</body>
</html>
