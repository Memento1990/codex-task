<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方案 C · 并发泳道指挥台 — Codex Floatboard 重设计</title>
<style>
:root{
  --panel:var(--raise);--panel2:var(--raise2);--panel3:var(--raise3);--line:var(--hair);--line2:var(--hair2);
  --bg:#06080a; --raise:#0b0e12; --raise2:#0f1318; --raise3:#141a21;
  --hair:#171d24; --hair2:#222b34; --hair3:#33414d;
  --fg:#c9d6e0; --fg2:#93a5b4; --dim:#61717f; --dim2:#42505c;
  --mint:#5eead4; --lime:#a3e635; --rose:#fb7185; --amber:#fbbf24; --sky:#60a5fa; --violet:#c084fc;
  --mono:ui-monospace,"JetBrains Mono","SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--mono);
  -webkit-font-smoothing:antialiased;font-size:11px;line-height:1.5;letter-spacing:.01em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:#222b34;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

.proto{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:26px 20px 88px}
.proto-tag{width:100%;max-width:1320px;display:flex;align-items:baseline;gap:12px;
  font-size:11px;color:var(--dim);margin-bottom:18px}
.proto-tag b{color:var(--fg);font-weight:600}
.proto-tag .rr{margin-left:auto;color:var(--dim2)}
.stage{width:100%;max-width:1320px;display:flex;justify-content:center;gap:24px;flex-wrap:wrap}
.screen-dock{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:90;
  display:flex;gap:2px;padding:5px;background:#0b0e12ee;border:1px solid #222b34;border-radius:11px;
  backdrop-filter:blur(14px);box-shadow:0 12px 32px #000c}
.screen-dock button{font-size:10.5px;color:var(--dim);padding:6px 11px;border-radius:7px;white-space:nowrap}
.screen-dock button:hover{background:#141a21;color:var(--fg2)}
.screen-dock button.on{background:var(--mint);color:#04120f;font-weight:600}
.screen-dock .sep{width:1px;background:#222b34;margin:4px 3px}

.win{background:var(--raise);border:1px solid var(--hair2);border-radius:9px;overflow:hidden;
  display:flex;flex-direction:column;box-shadow:0 28px 70px -16px #000f}
.win.wide{width:980px;height:690px}
.win.narrow{width:392px;height:646px}

/* ── 顶栏 ──────────────────────────────────────────────── */
.bar{height:36px;flex:none;display:flex;align-items:center;gap:9px;padding:0 6px 0 13px;
  border-bottom:1px solid var(--hair);background:var(--raise);user-select:none}
.bar .mark{color:var(--mint);font-size:10px;font-weight:700;letter-spacing:-.1em}
.bar h1{font-size:10.5px;font-weight:600;margin:0;letter-spacing:.16em;text-transform:uppercase;color:var(--fg2)}
.bar .conn{display:flex;align-items:center;gap:5px;font-size:9.5px;color:var(--dim);letter-spacing:.05em;
  border:1px solid var(--hair);padding:1px 6px;border-radius:2px}
.bar .conn i{width:4px;height:4px;border-radius:50%;background:var(--mint);box-shadow:0 0 5px var(--mint)}
.bar .spacer{flex:1}
.ibtn{width:26px;height:26px;display:grid;place-items:center;border-radius:4px;color:var(--dim)}
.ibtn:hover{background:var(--raise3);color:var(--fg)}
.ibtn svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.wctl{display:flex}
.wctl button{width:37px;height:36px;display:grid;place-items:center;color:var(--dim2)}
.wctl button:hover{background:var(--raise3);color:var(--fg)}
.wctl button.x:hover{background:#8f2231;color:#fff}
.wctl svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:1.2}

/* ── 常驻命令条（解决“功能深埋”） ─────────────────────── */
.cmdstrip{flex:none;display:flex;align-items:center;gap:0;border-bottom:1px solid var(--hair);
  background:var(--raise2)}
.cmdbar{flex:1;display:flex;align-items:center;gap:8px;padding:8px 13px;cursor:pointer;
  transition:background .1s;min-width:0}
.cmdbar:hover{background:var(--raise3)}
.cmdbar .k{font-size:10px;color:var(--dim2)}
.cmdbar .ph{flex:1;color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmdbar .kbd{font-size:9px;color:var(--dim2);border:1px solid var(--hair2);border-radius:3px;
  padding:1px 5px;letter-spacing:.04em;white-space:nowrap}
.quick{display:flex;border-left:1px solid var(--hair);flex:none}
.quick button{padding:0 11px;height:35px;font-size:10px;color:var(--dim);border-right:1px solid var(--hair);
  white-space:nowrap;transition:background .1s,color .1s;display:flex;align-items:center;gap:5px}
.quick button:last-child{border-right:0}
.quick button:hover{background:var(--raise3);color:var(--fg)}

/* ── 时间轴 + 泳道 ────────────────────────────────────── */
.axis{flex:none;display:grid;grid-template-columns:154px 1fr;border-bottom:1px solid var(--hair2);
  background:var(--raise);height:26px}
.axis .lab{font-size:8.5px;letter-spacing:.14em;color:var(--dim2);text-transform:uppercase;
  display:flex;align-items:center;padding-left:13px}
.axis .scale{position:relative;border-left:1px solid var(--hair2)}
.axis .tick{position:absolute;top:0;bottom:0;font-size:8.5px;color:var(--dim2);
  display:flex;align-items:center;padding-left:4px;border-left:1px solid var(--hair);white-space:nowrap}
.axis .tick.end{color:var(--mint);border-left-color:#1d3d38}
.axis .tick.end::before{content:'';position:absolute;left:-1px;top:0;bottom:0;width:1px;
  background:linear-gradient(180deg,var(--mint),transparent)}

/* 时间轨道与标签共用同一行，任务增多时在列表内滚动。 */
.lanes{flex:1;overflow-y:auto;min-height:0;position:relative;display:flex;flex-direction:column}
.lane{display:grid;grid-template-columns:154px 1fr;border-bottom:1px solid var(--hair);
  min-height:62px;flex:1 1 62px;cursor:pointer;transition:background .1s}
.lane:hover{background:#0d1116}
.lane.sel{background:#101820}
.lane.sel .llab{box-shadow:inset 2px 0 0 var(--mint)}
.llab{padding:8px 10px 8px 13px;border-right:1px solid var(--hair2);min-width:0;
  display:flex;flex-direction:column;justify-content:center;gap:3px;position:relative}
.llab .top{display:flex;align-items:center;gap:5px}
.llab .dot{width:5px;height:5px;border-radius:50%;flex:none}
.llab .dot.blocked{background:var(--rose);box-shadow:0 0 5px #fb718580}
.llab .dot.running{background:var(--sky)}
.llab .dot.waiting{background:var(--amber)}
.llab .dot.done{background:var(--lime)}
.llab .dot.unknown{background:var(--dim2)}
.llab .nm{font-size:10.5px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lane.sel .llab .nm{color:#fff}
.llab .sub{font-size:8.5px;color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.llab .sub b{color:var(--fg2);font-weight:500}

.track{position:relative;overflow:hidden;border-left:1px solid var(--hair2)}
.track .grid{position:absolute;inset:0;pointer-events:none}
.track .grid i{position:absolute;top:0;bottom:0;width:1px;background:var(--hair);opacity:.7}
.track .nowline{position:absolute;top:0;bottom:0;width:1px;background:var(--mint);opacity:.55;z-index:4}
.blk{position:absolute;height:15px;border-radius:2px;top:50%;transform:translateY(-50%);
  min-width:3px;z-index:2;transition:filter .1s}
.lane:hover .blk{filter:brightness(1.18)}
.blk.completed{background:#1f4a42;border:1px solid #2d6b5f;box-shadow:inset 0 0 0 1px #0b0e12}
.blk.inProgress{background:var(--sky);opacity:.9}
.blk.blocked{background:repeating-linear-gradient(45deg,#7f2534,#7f2534 3px,#5a1a25 3px,#5a1a25 6px);
  border:1px solid var(--rose)}
.blk.pending{background:#161d24;border:1px dashed #2b3742}
.blk:hover{z-index:6}
.blkmark{position:absolute;top:50%;transform:translate(-50%,-50%);z-index:5;width:15px;height:15px;
  display:grid;place-items:center;font-size:9px;font-weight:700;border-radius:2px;pointer-events:none}
.blkmark.b{background:var(--rose);color:#12060a;box-shadow:0 0 0 2px var(--raise),0 0 10px #fb718570}
.blkmark.w{background:var(--amber);color:#140f02;box-shadow:0 0 0 2px var(--raise)}
/* 起点早于窗口：左侧渐变提示“更早的活动被裁切”，不伪装成从窗口起点开始。 */
.clip{position:absolute;left:0;top:50%;transform:translateY(-50%);width:16px;height:15px;z-index:5;
  background:linear-gradient(90deg,var(--raise) 15%,transparent);pointer-events:none}
.clip::after{content:'‹';position:absolute;left:1px;top:-2px;font-size:11px;color:var(--dim2)}
/* ── 介入轨道（横向卡片） ─────────────────────────────── */
.rail{flex:none;border-top:1px solid var(--hair2);background:#07090b;display:flex;flex-direction:column}
.rail-h{display:flex;align-items:center;gap:9px;padding:6px 13px;border-bottom:1px solid var(--hair);
  font-size:8.5px;letter-spacing:.14em;color:var(--dim2);text-transform:uppercase}
.rail-h b{color:var(--rose);font-size:10px;letter-spacing:0}
.rail-h .hint2{text-transform:none;letter-spacing:0;font-size:9px;color:var(--dim2);margin-left:auto}
.rail-body{display:flex;gap:1px;overflow-x:auto;padding:0}
.acard{flex:none;width:212px;padding:9px 12px 10px;border-right:1px solid var(--hair);
  cursor:pointer;transition:background .1s;position:relative}
.acard:hover{background:#0e1318}
.acard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--rose)}
.acard.wait::before{background:var(--amber)}
.acard .at{font-size:10.5px;color:var(--fg);line-height:1.35;margin-bottom:5px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.acard .am{display:flex;gap:8px;font-size:8.5px;color:var(--dim2);white-space:nowrap}
.acard .am .w{color:var(--amber)}
.acard .am .d{color:var(--rose);margin-left:auto}

.foot{flex:none;height:27px;border-top:1px solid var(--hair);display:flex;align-items:center;gap:13px;
  padding:0 13px;font-size:9px;color:var(--dim2);background:var(--raise)}
.foot .r{margin-left:auto;display:flex;gap:13px}
.foot button{color:var(--dim);font-size:9px}
.foot button:hover{color:var(--fg2);text-decoration:underline}

/* ── 窄窗 ──────────────────────────────────────────────── */
.win.narrow .axis,.win.narrow .lanes{display:none}
.win.narrow .cmdbar .ph{font-size:10px}
.win.narrow .quick button{padding:0 7px;font-size:9px}
.win.narrow .quick button span.tx{display:none}
.nlist{flex:1;overflow-y:auto;min-height:0}
.ncard{padding:9px 11px;border-bottom:1px solid var(--hair);cursor:pointer}
.ncard:hover{background:#0d1116}
.ncard .h{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.ncard .h .dot{width:5px;height:5px;border-radius:50%;flex:none}
.ncard .h .nm{font-size:10.5px;color:var(--fg2);flex:1;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.ncard .h .tm{font-size:9px;color:var(--dim2);white-space:nowrap}
.ncard .mini{height:13px;position:relative;background:#0a0d10;border-radius:2px;
  border:1px solid #141a21;margin-top:6px;overflow:hidden}
.ncard .mini i{position:absolute;top:2px;bottom:2px;border-radius:1px;opacity:.9}
.ncard .mini .nb{position:absolute;top:0;bottom:0;width:2px;background:var(--rose);z-index:2}
.ncard .step{font-size:9px;color:var(--dim2);margin-top:5px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}

/* 泳道保持固定密度，滚动仅发生在任务列表和介入轨道内。 */
.win{position:relative;min-width:0}
.win.narrow{height:570px}
.tools{display:flex}
.bar .conn{white-space:nowrap}
.bar .conn.problem{color:var(--rose)}.bar .conn.problem i{background:var(--rose);box-shadow:none}
.ibtn.on{color:var(--mint);background:#132a28}
.cmdbar{text-align:left}
.quick svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.3}
.timestrip{display:flex;align-items:center;gap:10px;padding:6px 13px;border-bottom:1px solid var(--hair);background:#080b0e;flex:none}
.stream{font-size:8.5px;color:var(--dim);letter-spacing:.06em;display:flex;align-items:center;gap:5px}
.stream i{height:4px;width:4px;background:var(--mint);border-radius:50%}
.window-pick{display:flex;border:1px solid var(--hair2);border-radius:3px;padding:2px;gap:2px}
.window-pick button{font-size:8.5px;color:var(--dim);padding:1px 7px;border-radius:2px}
.window-pick button.on{color:var(--mint);background:#132a28}
.window-pick button:hover{color:var(--fg)}
.legend{display:flex;align-items:center;gap:5px;margin-left:auto;font-size:8px;color:var(--dim2)}
.legend i{width:7px;height:5px;margin-left:6px;border-radius:1px}
.legend .done{background:#2d6b5f}.legend .active{background:var(--sky)}.legend .stuck{background:#8f2a3a}
.legend .earlier{margin-left:8px}
.axis .scale{overflow:hidden}
.axis .tick.end{left:auto;right:0;padding:0 6px;background:var(--raise)}
.lanes{background:linear-gradient(90deg,transparent 153px,var(--hair2) 153px,var(--hair2) 154px,transparent 154px),repeating-linear-gradient(180deg,transparent 0,transparent 71px,var(--hair) 71px,var(--hair) 72px)}
.lane{min-height:72px;flex:0 0 72px;text-align:left}
.llab{gap:3px}
.llab .nm{font-size:11px}
.llab .current{font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dim)}
.track{border-left:0}
.track .nowline{right:0;left:auto;transform:none}
.partial-track{position:absolute;left:8px;bottom:6px;font-size:7.5px;color:var(--amber)}
.track-hint{position:absolute;right:8px;bottom:6px;font-size:7.5px;color:var(--dim2);background:var(--raise)}
.no-segments{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim2);font-size:8.5px}
.blk{height:14px}
.blkmark{pointer-events:auto}
.blkmark.b{top:65%}.blkmark.w{top:40%}
.clip{z-index:4}
.stuck-count{color:var(--rose)}
.rail-body{max-height:104px;min-height:49px}
.acard{width:222px;min-height:80px}
.rail-clear{padding:14px;color:var(--dim);font-size:9px}
.empty-lanes{padding:28px 15px;color:var(--dim);text-align:center}
.ncard .dot.blocked{background:var(--rose)}.ncard .dot.running{background:var(--sky)}
.ncard .dot.waiting{background:var(--amber)}.ncard .dot.done{background:var(--lime)}.ncard .dot.unknown{background:var(--dim2)}
.nmeta{display:flex;gap:9px;font-size:8.5px;color:var(--dim2);align-items:center}
.nmeta b{color:var(--fg2);font-weight:500}.nmeta .go{margin-left:auto;color:var(--dim)}
.ncard .mini i.completed{background:#2d6b5f}.ncard .mini i.inProgress{background:var(--sky)}
.ncard .mini i.blocked{background:repeating-linear-gradient(45deg,#8f2a3a,#8f2a3a 3px,#5a1a25 3px,#5a1a25 6px)}
.win.narrow .bar{gap:6px;padding-left:10px}.win.narrow .bar .conn{font-size:8px;padding:1px 4px}
.win.narrow .bar h1{font-size:9px;letter-spacing:.04em}.win.narrow .tools .ibtn{width:23px}
.win.narrow .wctl button{width:24px}.win.narrow .bar .mark{display:none}
.win.narrow .timestrip{padding:5px 11px;justify-content:space-between}
.win.narrow .rail-h{padding:5px 11px}.win.narrow .acard{min-height:69px;padding:7px 10px;width:210px}
.win.narrow .acard .at{-webkit-line-clamp:1}.win.narrow .rail-body{max-height:86px}
.win.narrow .foot{font-size:8px;gap:5px;padding:0 10px}.win.narrow .foot .r{gap:9px}
.lane:focus-visible,.ncard:focus-visible,.acard:focus-visible{outline:1px solid var(--mint);outline-offset:-2px}
/* 浅色仍保留指挥台的时间网格与低饱和状态色。 */
:root[data-theme="light"]{--raise:#fff;--raise2:#f5f7fa;--raise3:#eaf0f5;--hair:#e1e6ec;--hair2:#ccd5df;--hair3:#aebdcb;--mint:#0c8372;--sky:#2563b8;--rose:#be3550;--lime:#52831f;--amber:#966c06}
[data-theme="light"] .timestrip,[data-theme="light"] .rail{background:var(--raise2)}
[data-theme="light"] .lane:hover,[data-theme="light"] .ncard:hover,[data-theme="light"] .acard:hover{background:var(--raise3)}
[data-theme="light"] .lane.sel{background:#e7f1f4}[data-theme="light"] .lane.sel .llab .nm{color:var(--fg)}
[data-theme="light"] .ncard .mini{background:#edf1f5;border-color:var(--hair)}
[data-theme="light"] .ibtn.on,[data-theme="light"] .window-pick button.on{background:#dceee9}
[data-theme="light"] .screen-dock{background:#ffffffee;border-color:var(--hair2)}
[data-theme="light"] .screen-dock button.on{color:#fff}[data-theme="light"] .screen-dock button:hover{background:var(--raise3);color:var(--fg)}
@media(max-width:650px){.proto{padding:16px 8px 100px}.proto-tag{flex-wrap:wrap;gap:5px}.proto-tag .rr{display:none}.screen-dock{max-width:calc(100vw - 20px);overflow-x:auto;bottom:10px}.screen-dock button{padding:5px 8px}.win.wide{width:980px;flex-shrink:0}.stage{overflow-x:auto;justify-content:flex-start}.win.narrow{margin:auto}}
</style>
<link rel="stylesheet" href="shared/mock.css">
</head>
<body>
<div class="proto">
  <div class="proto-tag">
    <b>方案 C · 并发泳道指挥台</b><span>交互模型：横向时间轴看并发，常驻命令条直达全部功能</span>
    <span class="rr">原型 · 合成数据 · 非产品构建</span>
  </div>
  <div class="stage" id="stage"></div>
</div>
<nav class="screen-dock" id="dock"></nav>

<script src="shared/data.js"></script>
<script src="shared/kit.js"></script>
<script src="shared/mock.js"></script>
<script>
const K = KIT, FB = window.FB;
const S = { screen: 'main', sel: 'pay', window: 3600 };
if (location.hash.length > 1) S.screen = location.hash.slice(1);
const SCREENS = [
  ['main','主窗 980'], ['narrow','窄窗 392'], ['dock','贴边头像球'], ['|', ''],
  ['completed','完成记录'], ['settings','设置'], ['integration','Codex 接入'], ['|', ''],
  ['notifications','消息通知'], ['updates','版本更新'], ['repair','修复记录'],
];
const ICON = {
  min:'<path d="M4 10h12"/>', max:'<rect x="4" y="4" width="12" height="12" rx="1"/>',
  close:'<path d="m5 5 10 10M15 5 5 15"/>',
  dock:'<circle cx="10" cy="10" r="7"/><path d="M7 8 9 10 7 12m4 0h2"/>',
  gear:'<circle cx="10" cy="10" r="2.6"/><path d="M10 2.6v2M10 15.4v2M2.6 10h2M15.4 10h2M4.8 4.8l1.4 1.4M13.8 13.8l1.4 1.4M15.2 4.8l-1.4 1.4M6.2 13.8l-1.4 1.4"/>',
  more:'<circle cx="4" cy="10" r="1" fill="currentColor" stroke="none"/><circle cx="10" cy="10" r="1" fill="currentColor" stroke="none"/><circle cx="16" cy="10" r="1" fill="currentColor" stroke="none"/>',
  pin:'<path d="m7 3 7 0-1 5 3 3H4l3-3V3Zm3 8v6"/>',
};
const ic = (n) => `<svg viewBox="0 0 20 20">${ICON[n]}</svg>`;

function bar(narrow) {
  return `<div class="bar"><span class="mark">&gt;_</span><h1>${narrow ? '指挥台' : '并发指挥台'}</h1>
    <button class="conn ${['conflict','partial','error'].includes(FB.connection.state) ? 'problem' : ''}" data-screen="integration" title="查看 Codex 接入"><i></i>${MOCK.connectionLabel()}</button><div class="spacer"></div>
    <div class="tools">
      <button class="ibtn" data-mock="pin" title="切换置顶" aria-label="切换置顶">${ic('pin')}</button>
      <button class="ibtn" data-mock="dock" title="收起为头像球" aria-label="收起为头像球">${ic('dock')}</button>
      <button class="ibtn" data-mock="palette" title="命令面板" aria-label="命令面板">${ic('more')}</button>
    </div>
    <div class="wctl"><button data-mock="minimize" title="最小化" aria-label="最小化">${ic('min')}</button><button data-mock="maximize" title="切换窗口大小" aria-label="切换窗口大小">${ic('max')}</button><button class="x" data-mock="close" title="关闭窗口" aria-label="关闭窗口">${ic('close')}</button></div>
  </div>`;
}

function cmdstrip() {
  return `<div class="cmdstrip">
    <button class="cmdbar" data-mock="palette" title="搜索任务与命令 Ctrl+K">
      <span class="k">›</span><span class="ph">搜索任务，或输入命令…</span><span class="kbd">Ctrl K</span>
    </button>
    <div class="quick">
      <button data-screen="integration" title="Codex 接入">接入</button>
      <button data-screen="notifications" title="消息通知">通知</button>
      <button data-screen="settings" title="看板设置">${ic('gear')}<span class="tx">设置</span></button>
      <button data-screen="completed" title="完成记录">完成</button>
    </div>
  </div>`;
}

const pos = (ts, now) => (ts - (now - S.window)) / S.window * 100;
const markPos = (ts, now) => Math.max(1, Math.min(99, pos(ts, now)));
function segments(step, now, task) {
  const recorded = Array.isArray(step.segments) ? step.segments : step.timing?.partial ? [] : [{startedAt:step.startedAt,endedAt:step.endedAt}];
  return recorded.flatMap(record => {
    if (!Number.isFinite(record.startedAt)) return [];
    const end = record.endedAt ?? step.endedAt ?? (['inProgress','blocked'].includes(step.status) ? task.endedAt ?? now : record.startedAt);
    const start = Math.max(record.startedAt, now - S.window), finish = Math.min(end, now);
    if (finish <= start) return [];
    return [{left:pos(start,now),width:Math.max(.25,(finish-start)/S.window*100),clipped:record.startedAt < now-S.window}];
  });
}
function timestrip(narrow) {
  return `<div class="timestrip"><span class="stream"><i></i>${narrow ? '执行片段' : '执行片段 · 滚动时间窗'}</span>
    <div class="window-pick" aria-label="泳道时间窗口">${[1800,3600,7200].map(seconds => `<button data-window="${seconds}" class="${S.window === seconds ? 'on' : ''}" aria-pressed="${S.window === seconds}">${seconds / 60}m</button>`).join('')}</div>
    ${narrow ? '' : '<span class="legend"><i class="done"></i>完成<i class="active"></i>进行中<i class="stuck"></i>受阻<span class="earlier">‹ 更早片段</span></span>'}
  </div>`;
}
function axis(now) {
  return `<div class="axis"><div class="lab">任务 / 时间</div><div class="scale">
    ${[0,1,2,3].map(i => `<span class="tick" style="left:${i * 25}%">${K.fmtClock(now - S.window + S.window * i / 4).slice(0,5)}</span>`).join('')}
    <span class="tick end">现在</span>
  </div></div>`;
}
function laneBlock(step, now, task) {
  return segments(step,now,task).map(part => `<span class="blk ${step.status}" style="left:${part.left}%;width:${part.width}%;top:${step.status === 'blocked' ? 65 : 40}%" title="${K.esc(step.title)} · ${K.STATUS[step.status]}${step.timing?.partial ? ' · 部分计时' : ''}"></span>`).join('');
}
function lane(task, now) {
  const tone = K.tone(task), blockers = K.openBlockers(task);
  const blocks = task.plan.map(step => laneBlock(step, now,task)).join('');
  const clipped = task.plan.some(step => segments(step,now,task).some(part=>part.clipped));
  const marks = blockers.filter(blocker=>Number.isFinite(blocker.openedAt)).map(blocker => `<button class="blkmark b" data-mock="detail" data-task="${task.id}" data-blocker="${blocker.id}" style="left:${markPos(blocker.openedAt, now)}%" title="${K.esc(blocker.title)}${blocker.openedAt < now - S.window ? ' · 早于当前窗口' : ''}" aria-label="查看卡点：${K.esc(blocker.title)}">!</button>`).join('') + (task.status === 'waiting' && Number.isFinite(task.waitingSince) ? `<button class="blkmark w" data-mock="detail" data-task="${task.id}" style="left:${markPos(task.waitingSince,now)}%" title="等待确认${task.waitingSince < now-S.window ? ' · 早于当前窗口' : ''}" aria-label="查看等待确认的任务">?</button>` : '');
  return `<div class="lane ${S.sel === task.id ? 'sel' : ''}" role="button" tabindex="0" data-mock="detail" data-task="${task.id}" aria-label="查看任务：${K.esc(task.title)}">
    <div class="llab"><div class="top"><span class="dot ${tone}"></span><span class="nm" title="${K.esc(task.title)}">${K.esc(task.tag || task.title)}</span></div>
      <div class="sub"><b>${K.doneSteps(task)}/${task.plan.length}</b> · <span data-live-elapsed="${task.id}">${K.fmtCompact(K.elapsed(task))}</span>${task.timing?.partial ? ' · 部分' : ''}${blockers.length ? ` · <span class="stuck-count">!${blockers.length}</span>` : ''}</div>
      <div class="current">${K.esc(task.currentStep || '等待结构化汇报')}</div>
    </div>
    <div class="track"><div class="grid">${[0,25,50,75].map(left => `<i style="left:${left}%"></i>`).join('')}</div>
      ${blocks}${marks}${clipped ? '<span class="clip" title="部分执行片段早于当前窗口"></span>' : ''}
      ${!blocks ? '<span class="no-segments">此时间窗暂无已记录片段</span>' : ''}${task.plan.some(step=>step.timing?.partial) ? '<span class="partial-track">部分记录</span>' : ''}
      <span class="nowline"></span><span class="track-hint">${K.STATUS[task.status] || task.status} ↗</span>
    </div>
  </div>`;
}
function rail(tasks) {
  const items = K.actionItems(tasks), now = FB.now();
  return `<div class="rail"><div class="rail-h"><span>介入轨道</span><b>${items.length}</b><span class="hint2">最早开放在前</span></div>
    <div class="rail-body">${items.length ? items.map(item => {
      const task = item.task, blocker = item.blocker;
      return `<div class="acard ${item.kind === 'waiting' ? 'wait' : ''}" role="button" tabindex="0" data-mock="detail" data-task="${task.id}"${blocker ? ` data-blocker="${blocker.id}"` : ''}>
        <div class="at">${K.esc(blocker?.title || '等待你确认')}</div>
        <div class="am"><span>${K.esc(task.tag || task.title)}</span><span class="w">${K.esc(blocker?.owner || '你')}</span><span class="d"${blocker ? ` data-live-blocker="${blocker.id}"` : ''}>${Number.isFinite(item.at) ? K.fmtCompact(now - item.at) : '时间未记录'}</span></div>
      </div>`;
    }).join('') : '<div class="rail-clear">✓ 当前筛选下无需介入</div>'}</div></div>`;
}
function narrowCard(task, now) {
  const tone = K.tone(task), blockers = K.openBlockers(task);
  const blocks = task.plan.map(step => segments(step,now,task).map(part => `<i class="${step.status}" style="left:${part.left}%;width:${part.width}%"></i>`).join('')).join('');
  return `<div class="ncard" role="button" tabindex="0" data-mock="detail" data-task="${task.id}" aria-label="查看任务：${K.esc(task.title)}">
    <div class="h"><span class="dot ${tone}"></span><span class="nm">${K.esc(task.title)}</span><span class="tm" data-live-elapsed="${task.id}">${K.fmtCompact(K.elapsed(task))}</span></div>
    <div class="nmeta"><b>${K.doneSteps(task)}/${task.plan.length}</b><span>${K.STATUS[task.status] || task.status}</span>${task.timing?.partial ? '<span>部分计时</span>' : ''}${blockers.length ? `<span class="stuck-count">! ${blockers.length} 卡点</span>` : ''}<span class="go">↗</span></div>
    <div class="mini">${blocks}${blockers.filter(blocker=>Number.isFinite(blocker.openedAt)).map(blocker => `<span class="nb" style="left:${markPos(blocker.openedAt,now)}%"></span>`).join('')}</div>
    <div class="step">${K.esc(task.currentStep || '等待结构化汇报')}</div>
  </div>`;
}
function mainScreen(narrow) {
  const now = FB.now(), tasks = MOCK.tasks();
  return `<div class="win ${narrow ? 'narrow' : 'wide'}">
    ${bar(narrow)}${cmdstrip()}${MOCK.toolbar()}${timestrip(narrow)}
    ${narrow ? `<div class="nlist">${tasks.map(task => narrowCard(task,now)).join('') || '<div class="empty-lanes">没有匹配的任务</div>'}</div>` : `${axis(now)}<div class="lanes">${tasks.map(task => lane(task,now)).join('') || '<div class="empty-lanes">没有匹配的任务</div>'}</div>`}
    ${rail(tasks)}
    <div class="foot"><span>${tasks.length} 个任务 · 最近 ${S.window / 60}m</span><span class="r"><button data-mock="copy-session">复制会话 ID</button><button data-screen="completed">完成 ${FB.tasks.filter(task=>task.status==='completed').length} ↗</button></span></div>
  </div>`;
}
function render() {
  const screens = { main: () => mainScreen(false), narrow: () => mainScreen(true), dock: () => MOCK.dock('c') };
  document.getElementById('stage').innerHTML = MOCK.utility(S.screen) || (screens[S.screen] || screens.main)();
  document.getElementById('dock').innerHTML = SCREENS.map(([key,label]) => key === '|' ? '<span class="sep"></span>' : `<button class="${S.screen === key ? 'on' : ''}" data-screen="${key}">${label}</button>`).join('');
  MOCK.afterRender();
}
document.addEventListener('click', event => {
  const button = event.target.closest('[data-window]');
  if (button) { S.window = Number(button.dataset.window); render(); }
});
document.addEventListener('keydown', event => {
  if (['Enter',' '].includes(event.key) && event.target.matches('.lane,.ncard,.acard')) {
    event.preventDefault(); event.target.click();
  }
});
MOCK.install({variant:'c',state:S,render,selected:()=>S.sel,select:(id)=>{S.sel=id;}});
render();
</script>
</body>
</html>
